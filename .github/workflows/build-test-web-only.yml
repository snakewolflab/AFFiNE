name: Build, Test & Push (Web Only)

on:
  push:
    branches:
      - canary
    paths-ignore:
      - README.md
  pull_request:

env:
  DEBUG: napi:*
  BUILD_TYPE: canary
  APP_NAME: affine
  AFFINE_ENV: dev
  DEPLOYMENT_TYPE: affine

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 成果物を別ブランチにプッシュするための書き込み権限を追加
permissions:
  contents: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
          full-cache: true
      - name: Run oxlint
        run: yarn lint:ox
      - name: Run i18n codegen
        run: yarn affine @affine/i18n build
      - name: Run ESLint
        run: yarn lint:eslint --max-warnings=0

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04-arm
    env:
      NODE_OPTIONS: --max-old-space-size=14384
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
          full-cache: true
      - name: Run i18n codegen
        run: yarn affine @affine/i18n build
      - name: Run Type Check
        run: yarn typecheck

  build-web:
    name: Build & Push Web Artifact
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          # @affine/server を追加して、エラー定義に必要な依存パッケージ（NestJSなど）もインストールさせる
          extra-flags: workspaces focus @affine/monorepo @affine/web @affine/server
          electron-install: false
          full-cache: true

      - name: Run i18n codegen
        run: yarn affine @affine/i18n build

      - name: Build Web Assets
        run: yarn affine @affine/web build
        env:
          DISTRIBUTION: web
          PUBLIC_PATH: '/'

      # --- 以下デプロイステップ（変更なし） ---
      - name: Deploy Web Artifact to release-web branch
        if: github.ref == 'refs/heads/canary'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: release-web
          folder: packages/frontend/apps/web/dist
          force: true
          token: ${{ secrets.GITHUB_TOKEN }}
